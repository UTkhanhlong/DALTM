<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bài viết - Góc Lập Trình</title>
    <meta name="description" content="Chia sẻ kiến thức lập trình, an ninh mạng và kinh nghiệm thực tế cho sinh viên.">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#6366f1', secondary: '#4338ca', accent: '#818cf8', glass: 'rgba(255, 255, 255, 0.7)' },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'] },
                },
            },
        };
    </script>
    <style>
        :root {
            scroll-behavior: smooth;
        }

        body {
            background: #fcfcfd;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .progress-bar {
            height: 4px;
            background: linear-gradient(to right, #6366f1, #a855f7);
            width: 0%;
            position: fixed;
            top: 72px;
            left: 0;
            z-index: 60;
            transition: width 0.1s ease;
        }

        .prose h1,
        .prose h2,
        .prose h3 {
            font-weight: 800;
            color: #0f172a;
            scroll-margin-top: 100px;
        }

        .prose pre {
            position: relative;
            background: #1e293b !important;
            padding: 2rem !important;
            border-radius: 20px !important;
        }

        .copy-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 10px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .toc-item.active {
            border-left: 2px solid #6366f1;
            color: #6366f1;
            padding-left: 1rem;
        }
    </style>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="data.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js" defer></script>
</head>

<body class="text-slate-900 font-sans antialiased">
    <div class="progress-bar" id="reading-progress"></div>

    <!-- HEADER -->
    <header class="fixed top-0 left-0 right-0 z-50 glass-header">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <a href="index.html"
                class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-primary to-purple-600">Góc
                Lập Trình</a>
            <nav class="hidden md:flex gap-10 text-sm font-bold text-slate-600 uppercase tracking-widest">
                <a href="index.html" class="hover:text-primary transition">Trang chủ</a>
                <a href="blog.html" class="hover:text-primary transition">Bài viết</a>
                <a href="about.html" class="hover:text-primary transition">Giới thiệu</a>
            </nav>
        </div>
    </header>

    <!-- CONTENT -->
    <main class="pt-40 pb-32 max-w-7xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-12 gap-16">
        <!-- Sidebar TOC -->
        <aside class="hidden lg:block lg:col-span-3 sticky top-40 h-fit">
            <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-6">Mục lục nội dung</p>
            <div id="toc" class="space-y-4 border-l border-slate-100">
                <!-- TOC items will be injected here -->
            </div>
        </aside>

        <!-- Article -->
        <article class="lg:col-span-9">
            <div id="post-header" class="mb-16"></div>

            <div id="featured-image" class="w-full h-[500px] rounded-[40px] overflow-hidden mb-16 shadow-2xl relative">
                <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
            </div>

            <div id="post-content" class="prose prose-lg max-w-none text-slate-700 leading-relaxed">
                <!-- Content here -->
            </div>

            <hr class="my-20 border-slate-100">

            <div class="bg-slate-50 rounded-[32px] p-10 text-center">
                <h3 class="text-2xl font-black mb-4">Bạn thấy bài viết này thế nào?</h3>
                <p class="text-slate-500 mb-8">Nếu có thắc mắc, đừng ngần ngại liên hệ với mình qua trang Giới thiệu
                    nhé!</p>
                <a href="blog.html"
                    class="inline-flex items-center gap-2 font-bold text-primary hover:gap-4 transition-all">
                    <svg class="w-6 h-6 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                    Quay lại danh sách bài viết
                </a>
            </div>
        </article>
    </main>

    <!-- FOOTER -->
    <footer class="py-12 text-center text-slate-400 text-sm">
        © 2025 Góc Lập Trình. Bài viết của Nguyễn Khánh Long.
    </footer>

    <script shadow>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = parseInt(urlParams.get('id'));

            const post = posts.find(p => p.id === postId);

            if (post) {
                document.title = `${post.title} - Góc Lập Trình`;

                document.getElementById("post-header").innerHTML = `
                    <div class="flex items-center gap-3 mb-6">
                        <span class="px-3 py-1 bg-indigo-50 text-primary text-[10px] font-black uppercase tracking-widest rounded-full">${post.category}</span>
                        <span class="text-slate-300">•</span>
                        <span class="text-slate-400 text-xs font-bold">${post.date}</span>
                    </div>
                    <h1 class="text-5xl md:text-6xl font-black text-slate-900 leading-tight mb-8">${post.title}</h1>
                    <div class="flex items-center gap-3">
                        <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(post.author)}&background=6366f1&color=fff" class="w-10 h-10 rounded-full">
                        <span class="font-bold text-slate-600">${post.author}</span>
                    </div>
                `;

                document.getElementById("featured-image").innerHTML += `<img src="${post.image}" class="w-full h-full object-cover">`;

                const contentDiv = document.getElementById("post-content");
                contentDiv.innerHTML = post.content;

                // GENERATE TOC
                const headings = contentDiv.querySelectorAll('h2, h3');
                const toc = document.getElementById("toc");
                headings.forEach((h, i) => {
                    h.id = `heading-${i}`;
                    const item = document.createElement('a');
                    item.href = `#${h.id}`;
                    item.className = `toc-item block text-sm font-bold text-slate-400 hover:text-primary transition-all ml-4 ${h.tagName === 'H3' ? 'ml-8 text-xs' : ''}`;
                    item.innerText = h.innerText;
                    toc.appendChild(item);
                });

                // COPY CODE BUTTONS
                contentDiv.querySelectorAll('pre').forEach(pre => {
                    const btn = document.createElement('button');
                    btn.className = 'copy-btn';
                    btn.innerText = 'COPY';
                    btn.onclick = () => {
                        navigator.clipboard.writeText(pre.innerText.replace('COPY', ''));
                        btn.innerText = 'COPIED!';
                        setTimeout(() => btn.innerText = 'COPY', 2000);
                    };
                    pre.appendChild(btn);
                });

                if (window.Prism) Prism.highlightAll();

                // READING PROGRESS
                window.onscroll = () => {
                    const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                    const scrolled = (winScroll / height) * 100;
                    document.getElementById("reading-progress").style.width = scrolled + "%";
                };
            }
        });
    </script>
</body>

</html>
